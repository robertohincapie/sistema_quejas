[project]
name = "sistema-quejas"
version = "0.1.0"
description = "Clasificación y enrutamiento de quejas con LangGraph, LangChain y Pydantic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.10",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# Es una aplicación (no una librería a publicar): uv solo gestiona el entorno.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
